trigger:
- none

pool:
  vmImage: 'ubuntu-latest'

# ==========================================
# PARAMETERS
# ==========================================

parameters:
- name: action
  displayName: "Select Action"
  type: string
  default: apply
  values:
  - apply
  - destroy

# ==========================================
# VARIABLE GROUP
# ==========================================

variables:
- group: aks-terraform-vars

# ==========================================
# STAGES
# ==========================================

stages:

- stage: Terraform
  displayName: "AKS Terraform Deployment"

  jobs:

  - job: TerraformJob
    displayName: "Terraform AKS Execution"

    steps:

    # ==========================================
    # INSTALL TERRAFORM
    # ==========================================

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: '1.5.0'

    # ==========================================
    # TERRAFORM INIT
    # ==========================================

    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: 'azurerm'
        command: 'init'

        backendServiceArm: 'terraform_bootstarp'

        backendAzureRmResourceGroupName: '$(backend_rg_name)'

        backendAzureRmStorageAccountName: '$(backend_storage_account_name)'

        backendAzureRmContainerName: '$(backend_container_name)'

        backendAzureRmKey: 'aks.tfstate'

    # ==========================================
    # TERRAFORM FORMAT CHECK
    # ==========================================

    - script: terraform fmt
      displayName: "Terraform Format Check"
      condition: eq('${{ parameters.action }}', 'apply')

    # ==========================================
    # TERRAFORM VALIDATE
    # ==========================================

    - script: terraform validate
      displayName: "Terraform Validate"
      condition: eq('${{ parameters.action }}', 'apply')

    # ==========================================
    # TERRAFORM PLAN
    # ==========================================

    - task: TerraformTaskV4@4
      displayName: "Terraform Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'

        environmentServiceNameAzureRM: 'terraform_bootstarp'

        commandOptions: >
          -out=tfplan
          -var "resource_group_name=$(resource_group_name)"
          -var "location=$(location)"
          -var "aks_name=$(aks_name)"
          -var "dns_prefix=$(dns_prefix)"
          -var "node_count=$(node_count)"
          -var "vm_size=$(vm_size)"
          -var "existing_storage_account_name=$(existing_storage_account_name)"
          -var "existing_keyvault_name=$(existing_keyvault_name)"
          -var "storage_rg_name=$(storage_rg_name)"
          -var "keyvault_rg_name=$(keyvault_rg_name)"

      condition: eq('${{ parameters.action }}', 'apply')

    # ==========================================
    # TERRAFORM APPLY
    # ==========================================

    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        provider: 'azurerm'
        command: 'apply'

        environmentServiceNameAzureRM: 'terraform_bootstarp'

        commandOptions: 'tfplan'

      condition: eq('${{ parameters.action }}', 'apply')

    # ==========================================
    # TERRAFORM DESTROY PLAN
    # ==========================================

    - task: TerraformTaskV4@4
      displayName: "Terraform Destroy Plan"
      inputs:
        provider: 'azurerm'
        command: 'plan'

        environmentServiceNameAzureRM: 'terraform_bootstarp'

        commandOptions: >
          -destroy
          -out=destroy.tfplan
          -var "resource_group_name=$(resource_group_name)"
          -var "location=$(location)"
          -var "aks_name=$(aks_name)"
          -var "dns_prefix=$(dns_prefix)"
          -var "node_count=$(node_count)"
          -var "vm_size=$(vm_size)"
          -var "existing_storage_account_name=$(existing_storage_account_name)"
          -var "existing_keyvault_name=$(existing_keyvault_name)"
          -var "storage_rg_name=$(storage_rg_name)"
          -var "keyvault_rg_name=$(keyvault_rg_name)"

      condition: eq('${{ parameters.action }}', 'destroy')

    # ==========================================
    # TERRAFORM DESTROY
    # ==========================================

    - task: TerraformTaskV4@4
      displayName: "Terraform Destroy"
      inputs:
        provider: 'azurerm'
        command: 'apply'

        environmentServiceNameAzureRM: 'terraform_bootstarp'

        commandOptions: 'destroy.tfplan'

      condition: eq('${{ parameters.action }}', 'destroy')